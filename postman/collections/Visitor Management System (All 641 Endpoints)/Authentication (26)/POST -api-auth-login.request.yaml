$kind: http-request
name: POST /api/auth/login
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "belayyifra@gmail.com",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      const token = res.token || (res.data && res.data.token);
      if (token) {
        pm.collectionVariables.set("authToken", token);
        console.log("Saved authToken to collection variable:", token);
      }
      const refreshToken = res.refreshToken || (res.data && res.data.refreshToken);
      if (refreshToken) {
        pm.collectionVariables.set("refreshToken", refreshToken);
        console.log("Saved refreshToken to collection variable:", refreshToken);
      }
    language: text/javascript
order: 5000
