$kind: http-request
name: POST /api/checkin/:appointmentId/checkout
url: "{{baseUrl}}/api/checkin/:appointmentId/checkout"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  appointmentId: "1"
body:
  type: text
  content: |-
    {
      "checkoutMethod": "MANUAL",
      "remarks": "Visitor departed premises normally"
    }
order: 4000
