<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('vms_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="vms-initial-loader" style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #070b13;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      ">
        <!-- Background Image with Luminous Indigo-Cyan Glow -->
        <div style="
          position: absolute;
          inset: 0;
          background-image: url('/vms-loading-bg.jpg');
          background-size: cover;
          background-position: center;
          filter: brightness(0.6) saturate(1.3);
          transform: scale(1.05);
        "></div>

        <!-- Cosmic Gradient Overlay -->
        <div style="
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, rgba(37,99,235,0.3) 0%, rgba(15,23,42,0.85) 60%, rgba(7,11,19,0.98) 100%);
        "></div>

        <!-- Central Glassmorphic Card -->
        <div style="
          position: relative;
          z-index: 10;
          max-width: 440px;
          width: 90%;
          padding: 2.5rem 2rem;
          background: rgba(15, 23, 42, 0.75);
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
          border: 1px solid rgba(99, 102, 241, 0.35);
          border-radius: 1.5rem;
          box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 50px rgba(59, 130, 246, 0.25);
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
        ">
          <!-- 360° Orbital Spinner with Center Logo -->
          <div style="position: relative; width: 120px; height: 120px; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center;">
            <!-- Outer Continuous Ring -->
            <div style="
              position: absolute;
              inset: 0;
              border-radius: 50%;
              border: 3px solid rgba(99, 102, 241, 0.2);
              border-top-color: #6366f1;
              border-right-color: #38bdf8;
              animation: vms-spin 2.2s linear infinite;
            "></div>
            <!-- Inner Counter-Spinning Ring -->
            <div style="
              position: absolute;
              inset: 10px;
              border-radius: 50%;
              border: 2px dashed rgba(6, 182, 212, 0.35);
              border-bottom-color: #22d3ee;
              border-left-color: #818cf8;
              animation: vms-spin-rev 3s linear infinite;
            "></div>
            <!-- Center Logo Pedestal -->
            <div style="
              width: 72px;
              height: 72px;
              border-radius: 1rem;
              background: #ffffff;
              padding: 6px;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.4);
            ">
              <img src="/logo.png" alt="VMS" style="width: 100%; height: 100%; object-fit: contain;" />
            </div>
          </div>

          <!-- Pure Title: Visitor Management System(VMS) ONLY -->
          <div style="
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.02em;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.45rem;
          ">
            <span style="background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Visitor Management System</span>
            <span style="
              background: rgba(37, 99, 235, 0.25);
              color: #60a5fa;
              border: 1px solid rgba(96, 165, 250, 0.45);
              padding: 0.15rem 0.55rem;
              border-radius: 0.5rem;
              font-family: monospace;
              font-size: 0.85rem;
              letter-spacing: 0.05em;
              font-weight: 800;
            ">(VMS)</span>
          </div>

          <!-- Sleek Loading Bar -->
          <div style="width: 100%; max-width: 260px;">
            <div style="
              height: 6px;
              width: 100%;
              background: rgba(15, 23, 42, 0.8);
              border-radius: 9999px;
              overflow: hidden;
              border: 1px solid rgba(99, 102, 241, 0.3);
              position: relative;
            ">
              <div style="
                height: 100%;
                width: 70%;
                background: linear-gradient(90deg, #3b82f6, #06b6d4, #8b5cf6);
                border-radius: 9999px;
                animation: vms-progress 1.8s ease-in-out infinite;
              "></div>
            </div>
          </div>
        </div>

        <style>
          @keyframes vms-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
          @keyframes vms-spin-rev {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
          }
          @keyframes vms-progress {
            0% { width: 15%; transform: translateX(-20%); }
            50% { width: 75%; transform: translateX(20%); }
            100% { width: 90%; transform: translateX(10%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
