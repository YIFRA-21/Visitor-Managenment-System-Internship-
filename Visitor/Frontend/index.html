<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('vms_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#070b13';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
  </head>
  <body style="margin: 0; background-color: var(--vms-bg-canvas, #070b13); color: var(--vms-text-primary, #f8fafc);">
    <div id="root">
      <div id="vms-initial-loader" style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #070b13;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      ">
        <!-- Background Image with Luminous Indigo-Cyan Glow -->
        <div style="
          position: absolute;
          inset: 0;
          background-image: url('/vms-loading-bg.jpg');
          background-size: cover;
          background-position: center;
          filter: brightness(0.6) saturate(1.3);
          transform: scale(1.05);
        "></div>

        <!-- Cosmic Gradient Overlay -->
        <div style="
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, rgba(37,99,235,0.3) 0%, rgba(15,23,42,0.85) 60%, rgba(7,11,19,0.98) 100%);
        "></div>

        <!-- Central Glassmorphic Card -->
        <div style="
          position: relative;
          z-index: 10;
          max-width: 440px;
          width: 90%;
          padding: 2.75rem 2.25rem;
          background: rgba(13, 20, 36, 0.78);
          backdrop-filter: blur(28px);
          -webkit-backdrop-filter: blur(28px);
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 1.75rem;
          box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.85), 0 0 60px rgba(6, 182, 212, 0.16);
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
        ">
          <!-- 360° Rotating Transparency-Trail Spinner with Center Logo -->
          <div style="position: relative; width: 136px; height: 136px; margin-bottom: 1.75rem; display: flex; align-items: center; justify-content: center;">
            
            <!-- Ambient Behind-Logo Glow Aura -->
            <div style="
              position: absolute;
              inset: 12px;
              border-radius: 50%;
              background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(99, 102, 241, 0.15) 60%, transparent 100%);
              filter: blur(14px);
              animation: vms-pulse 3s ease-in-out infinite;
            "></div>

            <!-- Subtle Stationary Background Track Ring -->
            <div style="
              position: absolute;
              inset: 0;
              border-radius: 50%;
              border: 3px solid rgba(255, 255, 255, 0.06);
            "></div>

            <!-- Outer Smooth Transparency-Gradient Rotating Beam (Conic Transparency Trail) -->
            <div class="vms-conic-spinner" style="
              position: absolute;
              inset: 0;
              border-radius: 50%;
              padding: 3.5px;
              background: conic-gradient(from 0deg, transparent 0%, transparent 30%, rgba(6, 182, 212, 0.1) 50%, rgba(56, 189, 248, 0.5) 80%, #00f0ff 100%);
              -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #fff calc(100% - 3.5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #fff calc(100% - 3.5px));
              animation: vms-spin 1.8s linear infinite;
              filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.65));
            "></div>

            <!-- Orbiting Satellite Glow Beacon at the Leading Edge -->
            <div style="
              position: absolute;
              inset: 0;
              border-radius: 50%;
              animation: vms-spin 1.8s linear infinite;
              pointer-events: none;
            ">
              <div style="
                position: absolute;
                top: -3px;
                left: 50%;
                transform: translateX(-50%);
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #ffffff;
                box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 30px #38bdf8;
              "></div>
            </div>

            <!-- Inner Counter-Spinning Technical Dashed Ring -->
            <div style="
              position: absolute;
              inset: 8px;
              border-radius: 50%;
              border: 1.5px dashed rgba(56, 189, 248, 0.28);
              animation: vms-spin-rev 6s linear infinite;
            "></div>

            <!-- Crisp Pure White Center Logo Pedestal -->
            <div style="
              position: relative;
              z-index: 5;
              width: 76px;
              height: 76px;
              border-radius: 1.15rem;
              background: #ffffff;
              padding: 7px;
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid rgba(255, 255, 255, 0.95);
              box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), 0 0 25px rgba(56, 189, 248, 0.25);
            ">
              <img src="/logo.png" alt="VMS Logo" style="width: 100%; height: 100%; object-fit: contain;" />
            </div>
          </div>

          <!-- Pure Title: Visitor Management System(VMS) ONLY -->
          <div style="
            font-size: 1.45rem;
            font-weight: 900;
            letter-spacing: -0.01em;
            margin-bottom: 1.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
          ">
            <span style="background: linear-gradient(135deg, #ffffff 40%, #bae6fd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
              Visitor Management System
            </span>
            <span style="
              background: rgba(6, 182, 212, 0.12);
              color: #38bdf8;
              border: 1px solid rgba(56, 189, 248, 0.4);
              padding: 0.2rem 0.65rem;
              border-radius: 0.6rem;
              font-family: monospace;
              font-size: 0.85rem;
              letter-spacing: 0.06em;
              font-weight: 800;
              box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
            ">( VMS )</span>
          </div>

          <!-- Sleek Glowing Wave Progress Bar -->
          <div style="width: 100%; max-width: 240px;">
            <div style="
              height: 5px;
              width: 100%;
              background: rgba(255, 255, 255, 0.08);
              border-radius: 9999px;
              overflow: hidden;
              border: 1px solid rgba(255, 255, 255, 0.12);
              position: relative;
            ">
              <div style="
                height: 100%;
                width: 100%;
                background: linear-gradient(90deg, transparent 0%, #00f0ff 50%, #818cf8 80%, transparent 100%);
                border-radius: 9999px;
                animation: vms-progress 2s ease-in-out infinite;
                filter: drop-shadow(0 0 6px #00f0ff);
              "></div>
            </div>
          </div>
        </div>

        <style>
          @keyframes vms-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
          @keyframes vms-spin-rev {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
          }
          @keyframes vms-pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 0.85; transform: scale(1.05); }
          }
          @keyframes vms-progress {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(20%); }
            100% { transform: translateX(110%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
