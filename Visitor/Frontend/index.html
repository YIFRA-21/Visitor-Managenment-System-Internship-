<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitor Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('vms_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-bs-theme', theme);
          document.documentElement.style.colorScheme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="vms-initial-loader" style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #040812;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      ">
        <!-- Background Image with brightness overlay -->
        <div style="
          position: absolute;
          inset: 0;
          background-image: url('/vms-loading-bg.jpg');
          background-size: cover;
          background-position: center;
          filter: brightness(0.38) saturate(1.2);
          transform: scale(1.05);
        "></div>

        <!-- Radial Cyber Gradient -->
        <div style="
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at center, rgba(30,58,138,0.4) 0%, rgba(4,8,18,0.92) 75%, rgba(2,4,10,0.98) 100%);
        "></div>

        <!-- Central Glass Card -->
        <div style="
          position: relative;
          z-index: 10;
          max-width: 480px;
          width: 90%;
          padding: 2.25rem 2rem;
          background: rgba(15, 23, 42, 0.72);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(99, 102, 241, 0.3);
          border-radius: 1.5rem;
          box-shadow: 0 0 80px rgba(30, 58, 138, 0.5);
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
        ">
          <!-- Orbital Spinner with Logo -->
          <div style="position: relative; width: 110px; height: 110px; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center;">
            <div style="
              position: absolute;
              inset: 0;
              border-radius: 50%;
              border: 2px solid rgba(99, 102, 241, 0.4);
              border-top-color: #818cf8;
              animation: vms-spin 2.5s linear infinite;
            "></div>
            <div style="
              position: absolute;
              inset: 8px;
              border-radius: 50%;
              border: 2px solid rgba(6, 182, 212, 0.4);
              border-bottom-color: #22d3ee;
              animation: vms-spin-rev 4s linear infinite;
            "></div>
            <div style="
              width: 70px;
              height: 70px;
              border-radius: 1rem;
              background: #020617;
              border: 1px solid rgba(129, 140, 248, 0.5);
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 0 25px rgba(99, 102, 241, 0.5);
            ">
              <img src="/logo.png" alt="VMS" style="width: 44px; height: 44px; object-fit: contain;" />
            </div>
          </div>

          <!-- Enterprise Tag -->
          <div style="
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(129, 140, 248, 0.35);
            color: #a5b4fc;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
          ">
            ✦ Enterprise Access Control
          </div>

          <!-- Main Title with (VMS) -->
          <div style="
            font-size: 1.35rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.02em;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
          ">
            <span>Visitor Management System</span>
            <span style="
              background: rgba(6, 182, 212, 0.2);
              color: #22d3ee;
              border: 1px solid rgba(34, 211, 238, 0.45);
              padding: 0.15rem 0.55rem;
              border-radius: 0.5rem;
              font-family: monospace;
              font-size: 0.8rem;
              letter-spacing: 0.1em;
            ">(VMS)</span>
          </div>

          <p style="
            font-size: 0.75rem;
            color: #94a3b8;
            margin: 0 0 1.5rem 0;
            font-weight: 500;
          ">
            Smart Security, Zero-Trust Access & Identity Gateways
          </p>

          <!-- Loading Progress Bar -->
          <div style="width: 100%; max-width: 280px; margin-bottom: 1.25rem;">
            <div style="
              display: flex;
              justify-content: space-between;
              font-size: 11px;
              font-family: monospace;
              color: #22d3ee;
              font-weight: 700;
              margin-bottom: 0.4rem;
            ">
              <span id="vms-loader-status">✦ Initializing Security Protocols...</span>
            </div>
            <div style="
              height: 6px;
              width: 100%;
              background: #020617;
              border-radius: 9999px;
              overflow: hidden;
              border: 1px solid rgba(51, 65, 85, 0.6);
              position: relative;
            ">
              <div style="
                height: 100%;
                width: 65%;
                background: linear-gradient(90deg, #6366f1, #22d3ee, #818cf8);
                border-radius: 9999px;
                animation: vms-progress 2s ease-in-out infinite;
              "></div>
            </div>
          </div>

          <!-- Footer Telemetry -->
          <div style="
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 10px;
            font-family: monospace;
            color: #64748b;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-top: 1px solid rgba(51, 65, 85, 0.5);
            padding-top: 0.75rem;
            width: 100%;
            justify-content: center;
          ">
            <span style="color: #34d399;">🔒 TLS 1.3 SECURE</span>
            <span>•</span>
            <span style="color: #38bdf8;">⚡ SYSTEM ONLINE</span>
          </div>
        </div>

        <style>
          @keyframes vms-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
          }
          @keyframes vms-spin-rev {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
          }
          @keyframes vms-progress {
            0% { width: 20%; transform: translateX(-20%); }
            50% { width: 75%; transform: translateX(20%); }
            100% { width: 95%; transform: translateX(10%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
