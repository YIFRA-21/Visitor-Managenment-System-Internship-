$kind: http-request
url: "{{base_url}}/api/checkin/{{last_appointment_id}}/checkout"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "checkoutMethod": "MANUAL",
      "remarks": "Smooth checkout. Returned badge."
    }
auth:
  type: bearer
  credentials:
    token: "{{bearer_token}}"
order: 3000
