$kind: http-request
url: "{{base_url}}/api/checkin/scan"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "referenceCode": "{{last_reference_code}}",
      "badgeNumber": "BADGE-998822"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearer_token}}"
order: 1000
