$kind: http-request
url: "{{base_url}}/api/appointments"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "visitorId": 1,
      "hostId": 2,
      "scheduledStart": "2026-07-08 10:00:00",
      "scheduledEnd": "2026-07-08 11:30:00",
      "priority": "MEDIUM",
      "purpose": "Quarterly business review alignment"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearer_token}}"
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response && response.data && response.data.id) {
          pm.collectionVariables.set("last_appointment_id", response.data.id);
          pm.collectionVariables.set("last_reference_code", response.data.reference_code || response.data.referenceCode);
      }
    language: text/javascript
order: 1000
