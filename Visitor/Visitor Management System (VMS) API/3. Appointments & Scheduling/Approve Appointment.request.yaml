$kind: http-request
url: "{{base_url}}/api/appointments/{{last_appointment_id}}/approve"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "comment": "On-site documentation verified. Host approved."
    }
auth:
  type: bearer
  credentials:
    token: "{{bearer_token}}"
order: 2000
